function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',7000)}
function load(){
 try{
  const raw=localStorage.getItem(storageKey),old=localStorage.getItem(oldKey);
  state=raw?Model.validate(JSON.parse(raw)):old?Model.migrate(JSON.parse(old)):Model.fresh();blocked=false;
 }catch(e){blocked=true;$('#storage-warning').hidden=false;$('#storage-warning').textContent='本機資料讀取失敗，尚未覆寫原檔。請從備份頁匯出原始資料，再檢查瀏覽器儲存權限。';toast(e.message)}
}
function write(fn){
 if(blocked)throw Error('資料讀取失敗，目前禁止覆寫。請先匯出原始資料。');
 const raw=localStorage.getItem(storageKey),draft=raw?Model.validate(JSON.parse(raw)):structuredClone(state);
 fn(draft);const valid=Model.validate(draft);
 localStorage.setItem(storageKey,JSON.stringify(valid));state=valid;render();
}
function run(fn){Promise.resolve().then(fn).catch(e=>toast(e.message))}

function safeLink(url){try{const u=new URL(url);return u.protocol==='https:'&&(u.hostname==='calendar.google.com'||u.hostname==='www.google.com')?u.href:''}catch{return ''}}
function exportJSON(value,name){const u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function backup(){if(blocked)throw Error('請改用匯出原始資料。');load();if(blocked)return;const copy=structuredClone(state);copy.remote=Model.fresh().remote;exportJSON({app:APP.id,version:2,state:copy},APP.id+'-v2-'+Model.today()+'.json')}
function setView(v){view=v;selected='';render();window.scrollTo({top:0,behavior:'auto'})}
function rows(){return Model.ordered(state.tasks.filter(t=>Model.matches(t,filters)))}
function options(values,placeholder,current=''){return '<option value="">'+E(placeholder)+'</option>'+values.map(v=>'<option value="'+E(v)+'" '+(v===current?'selected':'')+'>'+E(v)+'</option>').join('')}
function filterStrip(){
 const out=$('#filters');out.hidden=!['list','calendar'].includes(view);if(out.hidden)return;
 out.innerHTML='<label class="sr-only" for="search">搜尋任務</label><input id="search" type="search" value="'+E(filters.search||'')+'" placeholder="搜尋標題、聯繫人、追蹤進度…" maxlength="160">'+
 (APP.community?'<select data-filter="community" aria-label="依社區篩選">'+options(state.lists.community,'全部社區',filters.community)+'</select>':'')+
 ['category','folder','person'].map(k=>'<select data-filter="'+k+'" aria-label="依'+Model.labels[k]+'篩選">'+options(state.lists[k],'全部'+Model.labels[k],filters[k])+'</select>').join('')+
 '<select data-filter="color" aria-label="依標題顏色篩選">'+options(Object.keys(Model.colors),'全部顏色',filters.color)+'</select><button data-act="clear">清除篩選</button>';
}
function buckets(){
 const list=state.tasks.filter(t=>Model.matches(t,{...filters,bucket:''}));
 const defs=[['completed','已完成',list.filter(t=>t.completed).length],['pending','未完成',list.filter(t=>!t.completed).length],['overdue','超期任務',list.filter(t=>Model.overdue(t)).length],['due','已到期',list.filter(Model.dueToday).length]];
 $('#stats').innerHTML=defs.map(([k,l,n])=>'<button class="stat '+(filters.bucket===k?'active':'')+'" data-bucket="'+k+'" aria-pressed="'+(filters.bucket===k)+'"><span>'+l+'</span><strong>'+n+'</strong><small>點選查看任務明細</small></button>').join('');
}

function calendarAction(t){
 try{return '<a class="calendar-action" href="'+E(Model.eventURL(t))+'" target="_blank" rel="noopener noreferrer">加入 Google 行事曆</a>'}
 catch{return '<button data-act="open-google" data-id="'+E(t.id)+'">加入 Google 行事曆</button>'}
}
function taskCard(t){
 const fields=[...(APP.community&&t.community?[['社區',t.community,'community']]:[]),['分類',t.category,'category'],['資料夾',t.folder,'folder'],['主要聯繫人',t.person,'person'],['處理階段',t.stage,'stage'],['優先級',t.priority,'priority']].filter(x=>x[1]);
 const badges=fields.map(([label,value,key])=>'<button class="badge tag" data-pick="'+key+'" data-value="'+E(value)+'">'+E(label)+' · '+E(value)+'</button>').join('');
 const dates=(t.startDate?t.startDate+(t.allDay?' 全天':' '+t.startTime):'未設開始')+' → '+(t.endDate?t.endDate+(t.allDay?' 全天':' '+t.endTime):'未設結束');
 const details=[t.contact&&'聯絡方式：'+t.contact,t.owner&&'負責人：'+t.owner,t.vendor&&'廠商：'+t.vendor,t.cost!==''&&'費用：NT$ '+Number(t.cost).toLocaleString('zh-TW'),t.next&&'下次保養：'+t.next].filter(Boolean).join(' ／ ');
 return '<article class="record '+(t.completed?'done':'')+'" style="--record-color:'+Model.colors[t.color]+'"><button class="check '+(t.completed?'done':'')+'" data-act="toggle" data-id="'+E(t.id)+'" aria-label="'+(t.completed?'標為未完成：':'標為完成：')+E(t.title)+'" aria-pressed="'+t.completed+'">'+(t.completed?'✓':'')+'</button><div class="record-body"><h3 style="color:'+Model.colors[t.color]+'">'+E(t.title)+'</h3><div class="meta">'+badges+'<span class="badge '+(Model.overdue(t)?'overdue':'')+'">'+(t.completed?'已完成':Model.overdue(t)?'超期任務':'未完成')+'</span><span>'+E(t.color)+'色</span></div><p class="dates">'+E(dates)+'（臺北時間）</p><p class="note">提醒需求：'+(t.reminderDefault?'請在 Google 選擇預設提醒':Model.reminder(t)===null?'未指定':E(t.reminderValue)+' '+E(t.reminderUnit)+'前')+' · 須在 Google 行程內設定</p>'+(details?'<p>'+E(details)+'</p>':'')+(t.notes?'<div class="tracking"><b>追蹤進度／內容</b><p>'+E(t.notes)+'</p></div>':'')+'<div class="row-actions"><button data-act="edit" data-id="'+E(t.id)+'">編輯</button>'+calendarAction(t)+'<button class="danger quiet" data-act="delete" data-id="'+E(t.id)+'">刪除本機</button>'+(t.next?'<button data-act="next" data-id="'+E(t.id)+'">建立下次保養</button>':'')+'</div><p class="note">開啟 Google 後請按「儲存」；重複加入會建立新行程。</p></div></article>';
}

 $('#nav').innerHTML=[['list','▤　任務總覽'],['calendar','▦　行事曆'],['lists','☷　手動清單管理'],['google','G　Gmail 行事曆'],['backup','⇅　備份與說明']].map(([k,l])=>'<button data-view="'+k+'" class="'+(view===k?'active':'')+'" '+(view===k?'aria-current="page"':'')+'>'+l+'</button>').join('');
 $('#legend-title').textContent=APP.community?'點社區看任務':'點資料夾看任務';

 $('#legend').innerHTML=state.lists[lk].map((n,i)=>'<button class="legend-button" data-pick="'+lk+'" data-value="'+E(n)+'"><span class="dot" style="background:'+(APP.community?({'國聚之碩':'#285f98','玉京名廈':'#737b85','厚禮':'#368169','區權會':'#b94350'}[n]||'var(--brand)'):'var(--brand)')+'"></span>'+E(n)+' <small>'+state.tasks.filter(t=>t[lk]===n).length+'</small></button>').join('')||'<p class="note">先到「手動清單管理」新增名稱。</p>';
 $('#google-indicator').textContent='Google 行程快捷新增';
 buckets();if(!skipFilters)filterStrip();
 const title={list:'任務總覽',calendar:'行事曆',lists:'手動清單管理',google:'Gmail／Google 行事曆',backup:'備份與使用說明'}[view];
 $('#view-title').textContent=title+(filters.bucket&&['list','calendar'].includes(view)?' · '+({completed:'已完成',pending:'未完成',overdue:'超期任務',due:'已到期'}[filters.bucket]):'');

  $('#content').innerHTML=(APP.community?'<div class="community-strip">'+state.lists.community.map(n=>'<button data-pick="community" data-value="'+E(n)+'" class="'+(filters.community===n?'primary':'')+'">'+E(n)+' · '+state.tasks.filter(t=>t.community===n).length+'</button>').join('')+'</div>':'')+(filtered.length?filtered.map(taskCard).join(''):'<div class="empty"><b>目前沒有符合條件的任務</b>新增任務，或清除篩選後查看。</div>');
 }else if(view==='calendar')calendarPage(filtered);
 else{ $('#count').textContent='';if(view==='lists')listsPage();if(view==='google')googlePage();if(view==='backup')backupPage();}
 $('#filter-summary').textContent=Object.entries(filters).filter(([k,v])=>v&&k!=='search').map(([k,v])=>(Model.labels[k]||({bucket:'狀態',color:'標題色'}[k])||k)+'：'+({completed:'已完成',pending:'未完成',overdue:'超期任務',due:'已到期'}[v]||v)).join(' ／ ');

function calendarPage(tasks){
 const [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay();
 let html='<section class="panel"><div class="month-head"><button data-month="-1" aria-label="上個月">←</button><h2>'+y+' 年 '+m+' 月</h2><div><button data-month="today">本月</button> <button data-month="1" aria-label="下個月">→</button></div></div><div class="calendar">'+['日','一','二','三','四','五','六'].map((d,i)=>'<div class="weekday '+(i===0||i===6?'weekend':'')+'">'+d+'</div>').join('')+'<div class="day blank"></div>'.repeat(first);
 for(let d=1;d<=days;d++){
  const date=month+'-'+String(d).padStart(2,'0'),day=new Date(date+'T12:00:00').getDay(),holiday=HOLIDAYS[date],weekend=day===0||day===6,daily=tasks.filter(t=>Model.onDate(t,date)),remote=visibleRemote().filter(r=>eventOnDate(r.event,date));
  html+='<button class="day '+(weekend?'weekend ':'')+(holiday?.off?'holiday ':'')+(date===Model.today()?'today ':'')+(date===selected?'selected':'')+'" data-date="'+date+'" aria-label="'+date+(weekend?' 週末':'')+' '+E(holiday?.name||'')+' '+daily.length+' 項任務、'+remote.length+' 項 Google 行程"><span>'+d+'</span>'+(holiday?.name?'<small class="holiday-name">'+E(holiday.name)+'</small>':weekend?'<small>週末</small>':'')+daily.slice(0,2).map(t=>'<small style="color:'+Model.colors[t.color]+'">• '+E(t.title)+'</small>').join('')+(remote.length?'<small>G '+remote.length+' 項行程</small>':'')+(daily.length>2?'<small>另 '+(daily.length-2)+' 項任務</small>':'')+'</button>';
 }
 html+='</div><p class="note">2026、2027 假日依人事行政總處辦公日曆表；週末另以底色標示。跨日任務依起迄日期顯示。'+(![2026,2027].includes(y)?'本年度未內建假日資料，僅顯示週末。':'')+'</p></section>';
 const dated=tasks.filter(t=>selected?Model.onDate(t,selected):Model.onDate(t,month+'-01')||(t.startDate||t.endDate||'').slice(0,7)===month||(t.endDate||'').slice(0,7)===month);
 $('#count').textContent=dated.length+' 項任務';
 html+='<div class="toolbar"><h2>'+E(selected||month)+' 的安排</h2><button class="primary" data-act="new-date">＋ 新增任務</button></div>'+dated.map(taskCard).join('');
 const remote=visibleRemote().filter(r=>selected?eventOnDate(r.event,selected):eventOnDate(r.event,month+'-01')||(r.event.start?.date||r.event.start?.dateTime||'').slice(0,7)===month);
 html+=remote.length?'<h2 class="section-title">Google 行程（已選日曆）</h2>'+remote.map(remoteCard).join(''):'';
 if(!dated.length&&!remote.length)html+='<div class="empty">此日期範圍沒有符合條件的安排。</div>';
 $('#content').innerHTML=html;
}

'use strict';
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.bucket){filters.bucket=filters.bucket===b.dataset.bucket?'':b.dataset.bucket;view='list';selected='';render();return}
 if(b.dataset.pick){filters[b.dataset.pick]=b.dataset.value;view='list';render();$('#view-title').scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.month){
  const [y,m]=month.split('-').map(Number);month=b.dataset.month==='today'?Model.today().slice(0,7):Model.dateKey(new Date(y,m-1+Number(b.dataset.month),1)).slice(0,7);selected='';render();return;
 }
 if(b.dataset.date){selected=b.dataset.date;render();return}
 const action=b.dataset.act,id=b.dataset.id;
 if(!action)return;
 if(action==='open-google'){try{const t=state.tasks.find(t=>t.id===id);if(!t)throw Error('找不到任務。');const url=Model.eventURL(t);window.open(url,'_blank','noopener,noreferrer')}catch(err){toast(err.message)}return}
 if(action==='add'||action==='new-date'){openEditor();return}
 if(action==='close'){$('#editor').close();return}
 if(action==='clear'){filters={};selected='';render();return}
 if(action==='edit'){const t=state.tasks.find(t=>t.id===id);if(t)openEditor(t);return}
 run(async()=>{
  if(action==='backup')backup();
  if(action==='restore')$('#import-file').click();
  if(action==='raw')exportJSON({app:APP.id,v2:localStorage.getItem(storageKey),v1:localStorage.getItem(oldKey)},APP.id+'-raw-'+Model.today()+'.json');
  if(action==='toggle')write(s=>{const t=s.tasks.find(t=>t.id===id);if(t){t.completed=!t.completed;t.updated=new Date().toISOString()}});
  if(action==='delete'){
   const t=state.tasks.find(t=>t.id===id);
   if(t&&confirm('只刪除本機「'+t.title+'」？Google 上的事件仍會保留。'))write(s=>s.tasks=s.tasks.filter(t=>t.id!==id));
  }
  if(action==='rename-list'){
   const name=prompt('新的'+Model.labels[b.dataset.list]+'名稱',b.dataset.value);
   if(name?.trim()){write(s=>Model.rename(s,b.dataset.list,b.dataset.value,name.trim()));if(filters[b.dataset.list]===b.dataset.value)filters[b.dataset.list]=name.trim();render()}
  }
  if(action==='remove-list'&&confirm('刪除清單名稱「'+b.dataset.value+'」？使用中的名稱會阻止刪除。'))write(s=>Model.removeList(s,b.dataset.list,b.dataset.value));
  if(action==='next'){
   const t=state.tasks.find(t=>t.id===id);
   if(t&&confirm('建立 '+t.next+' 的下次保養任務？')){
    const copy=Model.task({...t,id:Model.uid(),startDate:t.next,endDate:t.next,next:'',completed:false,g:null,title:(t.title.slice(0,150)+'（下次）'),updated:new Date().toISOString()});
    write(s=>s.tasks.push(copy));
   }
  }
 });
});
document.addEventListener('input',e=>{
 if(e.target.id==='search'){filters.search=e.target.value.trim();render(true)}
});
document.addEventListener('change',e=>{
 if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;render()}
 if(e.target.name==='allDay'&&e.target.closest('#form')){
  for(const k of ['startTime','endTime'])$('#form').elements[k].disabled=e.target.checked;

});
document.addEventListener('submit',e=>{
 if(e.target.id==='form'){
  e.preventDefault();const f=e.target;
  if(!f.reportValidity())return;
  try{
   const data=new FormData(f),old=state.tasks.find(t=>t.id===editId),draft={...(old||Model.blank())};
   for(const k of ['title',...Model.lists,'contact','startDate','startTime','endDate','endTime','reminderValue','reminderUnit','color','notes','next','cost'])if(data.has(k))draft[k]=String(data.get(k)).trim();
   draft.allDay=data.has('allDay');draft.completed=data.has('completed');draft.reminderDefault=data.has('reminderDefault');
   if(draft.allDay){draft.startTime='';draft.endTime=''}
   draft.updated=new Date().toISOString();if(draft.g)draft.g={...draft.g,dirty:true};
   const t=Model.task(draft);
   write(s=>{
    if(editId){const prev=s.tasks.find(t=>t.id===editId);if(!prev||prev.updated!==editStamp)throw Error('此任務已被其他分頁修改。請關閉視窗後重新編輯。');s.tasks=s.tasks.map(r=>r.id===editId?t:r)}
    else s.tasks.push(t);
    for(const k of Model.lists)if(t[k]&&!s.lists[k].includes(t[k]))s.lists[k].push(t[k]);
   });
   $('#editor').close();toast('任務已儲存；按「加入 Google 行事曆」後，仍需到 Google 按儲存並設定提醒。');
  }catch(err){$('#form-error').textContent=err.message}
 }else if(e.target.matches('.list-add')){
  e.preventDefault();const f=e.target,k=f.dataset.list,name=f.elements.name.value.trim();
  run(()=>{if(!name)throw Error('請填名稱。');if(state.lists[k].includes(name))throw Error('名稱已存在。');write(s=>s.lists[k].push(name))});
 }
});
$('#import-file').onchange=async e=>{
 const file=e.target.files[0];e.target.value='';if(!file)return;
 try{
  if(file.size>10*1024*1024)throw Error('備份超過 10 MB。');
  const data=JSON.parse(await file.text());
  if(data.app!==APP.id)throw Error('這是另一套 APP 的備份，B 與 C 不能混用。');
  const imported=data.version===2?Model.validate(data.state):data.version===1?Model.migrate(data.items):null;
  if(!imported)throw Error('不支援此備份版本。');
  imported.remote=Model.fresh().remote;
  if(confirm('以備份的 '+imported.tasks.length+' 筆任務覆蓋目前 '+state.tasks.length+' 筆與手動清單？請先備份。')){
   write(s=>Object.assign(s,imported));render();toast('備份已還原。');
  }
 }catch(err){toast('未還原：'+err.message)}
};
window.addEventListener('storage',e=>{if(e.key===storageKey){load();render();toast('另一分頁已更新資料。')}});
setInterval(()=>{if(['list','calendar'].includes(view)&&!$('#editor').open)render(true)},60000);
load();document.body.classList.toggle('community',APP.community);render();

</script></body></html>
